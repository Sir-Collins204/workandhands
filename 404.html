<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Work&Hands.">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Work&Hands</title>
  <link rel="icon" type="image/png" href="images/logo-no-words.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>

  <main id="main-content">

    <section class="error-page">
      <div class="container">

        <div class="error-content reveal">
          <span class="eyebrow">Error 404</span>

          <div class="error-code" aria-hidden="true">
            <span>4</span>
            <span>0</span>
            <span>4</span>
          </div>

          <h1>OOPS! Page not found.</h1>
          <p>
            The page you're looking for doesn't exist, has been moved, or is
            taking a well-deserved break. Let's get you back to a clean, working
            page.
          </p>

          <div class="error-actions">
            <a href="/" class="btn btn-primary">
              <i class="fa-solid fa-house"></i> Back to Home
            </a>
            <a href="/services" class="btn btn-outline">
              <i class="fa-solid fa-layer-group"></i> Browse Services
            </a>
          </div>

          <div class="error-suggestions">
            <p>Or try one of these pages:</p>
            <div class="error-links">
              <a href="/booking"><i class="fa-regular fa-calendar-check"></i> Book a Service</a>
              <a href="/contact"><i class="fa-regular fa-envelope"></i> Contact Us</a>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <div id="site-footer"></div>
  <script src="js/script.js"></script>
</body>
</html>
